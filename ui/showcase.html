<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AuthLens — offline showcase</title>
<style>/* AuthLens — a dark instrument panel: deep slate, cyan accents, monospace data. */
:root {
  --bg: #080c12;
  --bg-2: #0c121a;
  --panel: rgba(18, 27, 38, 0.86);
  --panel-solid: #121b26;
  --line: rgba(148, 163, 184, 0.14);
  --line-strong: rgba(148, 163, 184, 0.26);
  --text: #e8eef6;
  --muted: #8b9cad;
  --accent: #4cc9f0;
  --accent-2: #7aa2f7;
  --ok: #35d07f;
  --warn: #f5a524;
  --bad: #f0687a;
  --critical: #ff4d6d;
  --radius: 14px;
  --mono: "JetBrains Mono", "SFMono-Regular", ui-monospace, "Cascadia Code", monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--sans);
  color: var(--text);
  background:
    radial-gradient(900px 500px at 12% -8%, rgba(76, 201, 240, 0.14), transparent 60%),
    radial-gradient(700px 420px at 92% 4%, rgba(122, 162, 247, 0.12), transparent 65%),
    linear-gradient(180deg, #090e15 0%, #070b11 100%);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.45;
}
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100vh; }

/* ---------------------------------------------------------------- rail */
.rail {
  display: flex; flex-direction: column; gap: 22px;
  padding: 22px 16px 18px;
  border-right: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(13, 20, 29, 0.95), rgba(9, 14, 20, 0.9));
  backdrop-filter: blur(8px);
}
.brand { display: flex; align-items: center; gap: 11px; padding: 0 6px; }
.brand__mark {
  width: 36px; height: 36px; display: grid; place-items: center;
  border-radius: 11px; color: #04121a;
  background: linear-gradient(145deg, var(--accent), var(--accent-2));
  box-shadow: 0 6px 18px rgba(76, 201, 240, 0.32);
}
.brand__mark .icon { width: 21px; height: 21px; stroke-width: 1.7; }
.brand__text { display: flex; flex-direction: column; line-height: 1.15; }
.brand__text strong { font-size: 15px; letter-spacing: 0.2px; }
.brand__text span { font-size: 11px; color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav__item {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 10px 11px; border: 1px solid transparent; border-radius: 11px;
  background: none; color: var(--muted); text-align: left; cursor: pointer;
  font: inherit; transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
}
.nav__item:hover { background: rgba(148, 163, 184, 0.07); color: var(--text); }
.nav__item.is-active {
  background: linear-gradient(100deg, rgba(76, 201, 240, 0.16), rgba(122, 162, 247, 0.06));
  border-color: rgba(76, 201, 240, 0.32); color: var(--text);
}
.nav__item .icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; }
.nav__text { display: flex; flex-direction: column; }
.nav__label { font-size: 13.5px; font-weight: 600; }
.nav__hint { font-size: 11px; color: var(--muted); letter-spacing: 0.01em; }
.rail__foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; }
.rail__cap { margin: 0 0 8px; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.stacklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
.stacklist b { color: var(--text); font-weight: 600; }

/* -------------------------------------------------------------- main */
.main { display: flex; flex-direction: column; min-width: 0; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  padding: 18px 26px 16px; border-bottom: 1px solid var(--line);
  background: rgba(9, 14, 20, 0.55); backdrop-filter: blur(6px);
}
.topbar__title { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
.topbar__sub { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
.layer-chips { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
.lchip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px;
  background: rgba(18, 27, 38, 0.7); font-size: 11.5px; color: var(--muted);
}
.lchip code { font-family: var(--mono); font-size: 11px; color: var(--text); }
.lchip__dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px currentColor; }
.lchip--core .lchip__dot { background: #ff9f68; }
.lchip--main .lchip__dot { background: var(--accent); }
.lchip--ui .lchip__dot { background: var(--accent-2); }
.lchip--uptime { color: var(--muted); font-family: var(--mono); }
.lchip--bad { color: var(--bad); border-color: rgba(240, 104, 122, 0.4); }

.outlet { overflow-y: auto; padding: 22px 26px 46px; scroll-behavior: smooth; }
.view { display: grid; gap: 16px; max-width: 1180px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1080px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } .app { grid-template-columns: 210px minmax(0,1fr); } }

/* -------------------------------------------------------------- cards */
.card {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.24);
  overflow: hidden;
}
.card__head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.card__title { margin: 0; font-size: 13.5px; font-weight: 650; letter-spacing: 0.01em; }
.card__sub { margin: 3px 0 0; font-size: 11.8px; color: var(--muted); }
.card__body { padding: 14px 16px 16px; display: grid; gap: 12px; }
.card--notes .card__body { padding-top: 10px; }
.stack { display: grid; gap: 16px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.row--end { align-items: end; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; }
.toolbar { display: flex; align-items: center; gap: 9px; }
.spacer { flex: 1; }
.muted { color: var(--muted); font-size: 12px; }
.mono { font-family: var(--mono); font-size: 12px; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34ch; display: inline-block; vertical-align: bottom; }

/* ----------------------------------------------------------- controls */
.input {
  width: 100%; padding: 9px 11px; color: var(--text); font: inherit; font-size: 12.5px;
  background: rgba(6, 10, 15, 0.7); border: 1px solid var(--line-strong); border-radius: 9px;
  transition: border-color 140ms ease, box-shadow 140ms ease;
}
.input:focus { outline: none; border-color: rgba(76, 201, 240, 0.65); box-shadow: 0 0 0 3px rgba(76, 201, 240, 0.12); }
.input--area { resize: vertical; font-family: var(--mono); font-size: 11.8px; line-height: 1.55; min-height: 76px; }
.input--select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field__label { font-size: 10.6px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); }
.field__hint { font-size: 11px; color: var(--muted); }

.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px;
  font: inherit; font-size: 12.5px; font-weight: 600; color: #04121a; cursor: pointer;
  border: 1px solid transparent; border-radius: 9px;
  background: linear-gradient(145deg, var(--accent), #58a6f5);
  box-shadow: 0 6px 16px rgba(76, 201, 240, 0.24);
  transition: transform 120ms ease, filter 120ms ease;
}
.btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn--ghost { background: rgba(148, 163, 184, 0.1); color: var(--text); border-color: var(--line-strong); box-shadow: none; }
.btn--quiet { background: none; color: var(--muted); border-color: transparent; box-shadow: none; }
.btn--quiet:hover { color: var(--text); background: rgba(148, 163, 184, 0.08); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; flex-direction: column; align-items: flex-start; gap: 1px;
  padding: 7px 11px; cursor: pointer; text-align: left;
  background: rgba(148, 163, 184, 0.07); border: 1px solid var(--line);
  border-radius: 10px; color: var(--text); font: inherit; transition: all 140ms ease;
}
.chip:hover { border-color: rgba(76, 201, 240, 0.45); background: rgba(76, 201, 240, 0.1); transform: translateY(-1px); }
.chip__label { font-size: 12px; font-weight: 600; }
.chip__hint { font-size: 10.5px; color: var(--muted); font-family: var(--mono); }

.badge {
  display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px;
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  border: 1px solid var(--line-strong); color: var(--muted); background: rgba(148, 163, 184, 0.08);
}
.badge--ok { color: #052e1c; background: var(--ok); border-color: transparent; }
.badge--bad { color: #34060f; background: var(--bad); border-color: transparent; }
.badge--warn { color: #2b1a00; background: var(--warn); border-color: transparent; }
.badge--critical { color: #34060f; background: var(--critical); border-color: transparent; }
.badge--high { color: #2b0c00; background: #ff8a5c; border-color: transparent; }
.badge--medium { color: #2b1a00; background: var(--warn); border-color: transparent; }
.badge--low { color: #0b1b2b; background: #8fb8de; border-color: transparent; }
.badge--info, .badge--idle { color: var(--muted); background: rgba(148, 163, 184, 0.1); border-color: var(--line-strong); }

/* -------------------------------------------------------------- code */
.code-wrap { position: relative; }
.code {
  margin: 0; padding: 12px 13px; overflow: auto; max-height: 340px;
  background: rgba(4, 8, 12, 0.82); border: 1px solid var(--line); border-radius: 10px;
  font-family: var(--mono); font-size: 11.6px; line-height: 1.6; color: #cfe3f5;
  white-space: pre-wrap; word-break: break-word;
}
.code--tight { max-height: 220px; }
.code--tiny { max-height: 150px; opacity: 0.92; }
.code__copy {
  position: absolute; top: 8px; right: 8px; padding: 4px 8px; cursor: pointer;
  font: inherit; font-size: 10.5px; color: var(--muted);
  background: rgba(18, 27, 38, 0.9); border: 1px solid var(--line); border-radius: 7px;
  opacity: 0; transition: opacity 140ms ease, color 140ms ease;
}
.code-wrap:hover .code__copy { opacity: 1; }
.code__copy:hover { color: var(--accent); }

/* ------------------------------------------------------------ results */
.verdict-card { padding: 18px 20px; }
.verdict-grid { display: flex; align-items: center; gap: 26px; }
.verdict-summary { display: grid; gap: 8px; }
.ring { position: relative; width: 116px; height: 116px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring__track { fill: none; stroke: rgba(148, 163, 184, 0.16); stroke-width: 8; }
.ring__bar { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 600ms cubic-bezier(.22,.61,.36,1); }
.ring__bar--ok { stroke: var(--ok); }
.ring__bar--good { stroke: #9ede73; }
.ring__bar--warn { stroke: var(--warn); }
.ring__bar--bad { stroke: var(--bad); }
.ring__text { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.05; }
.ring__text strong { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.ring__text span { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

.findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 430px; overflow: auto; }
.finding {
  display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 10px;
  padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: rgba(8, 12, 18, 0.55); border-left: 3px solid var(--line-strong);
}
.finding--critical { border-left-color: var(--critical); }
.finding--high { border-left-color: #ff8a5c; }
.finding--medium { border-left-color: var(--warn); }
.finding--low { border-left-color: #8fb8de; }
.finding--info { border-left-color: rgba(148, 163, 184, 0.5); }
.finding__sev { font-size: 9.8px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); padding-top: 2px; }
.finding__title { margin: 0; font-size: 12.8px; font-weight: 620; }
.finding__detail { margin: 3px 0 5px; font-size: 11.8px; color: var(--muted); }
.finding__id { font-family: var(--mono); font-size: 10.4px; color: rgba(148, 163, 184, 0.72); }

.verdict { display: grid; gap: 8px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(8, 12, 18, 0.55); }
.verdict--ok { border-color: rgba(53, 208, 127, 0.4); background: rgba(53, 208, 127, 0.07); }
.verdict--bad { border-color: rgba(240, 104, 122, 0.42); background: rgba(240, 104, 122, 0.07); }
.verdict--idle { border-color: var(--line-strong); }
.verdict__head { display: flex; align-items: center; gap: 8px; }
.verdict__note { margin: 0; font-size: 12.2px; color: var(--text); }
.empty { margin: 0; font-size: 12.2px; color: var(--muted); font-style: italic; }

.table-scroll { overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
.table { width: 100%; border-collapse: collapse; font-size: 11.8px; }
.table th {
  position: sticky; top: 0; text-align: left; padding: 8px 10px; font-size: 10px;
  letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted);
  background: rgba(10, 16, 23, 0.96); border-bottom: 1px solid var(--line); font-weight: 600;
}
.table td { padding: 7px 10px; border-bottom: 1px solid rgba(148, 163, 184, 0.08); vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.table code { font-family: var(--mono); font-size: 11px; color: #cfe3f5; }
.table .num { font-family: var(--mono); color: var(--muted); }

.timeline { display: flex; flex-wrap: wrap; gap: 18px; }
.kv { display: grid; gap: 1px; min-width: 0; }
.kv__k { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.kv__v { font-size: 12.4px; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.pairs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 18px; }
.bullets { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 12.2px; color: var(--muted); }
.bullets li::marker { color: var(--accent); }
.checks { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.check { display: inline-flex; align-items: center; gap: 7px; font-size: 12.2px; color: var(--text); cursor: pointer; }
.check input { accent-color: var(--accent); }
.checks--result { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checks--result li { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; font-size: 12px; }
.steps { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 12.3px; color: var(--muted); }
.steps code { font-family: var(--mono); color: var(--accent); font-size: 11.4px; }
.steps b { color: var(--text); }
.urls { margin: 0; padding-left: 20px; display: grid; gap: 7px; font-size: 11.6px; }
.urls code { font-family: var(--mono); color: var(--text); word-break: break-all; }

.keylist { display: grid; gap: 10px; }
.key { padding: 12px; border: 1px solid var(--line); border-radius: 11px; background: rgba(8, 12, 18, 0.5); display: grid; gap: 9px; }
.key__head { display: flex; align-items: center; gap: 8px; }
.key__id { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.key__rows { display: flex; gap: 20px; }
.key__thumb { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }

/* ------------------------------------------------------------- toasts */
.toasts { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 9px; z-index: 40; }
.toast {
  padding: 10px 14px; border-radius: 10px; font-size: 12.4px; color: var(--text);
  background: rgba(18, 27, 38, 0.96); border: 1px solid var(--line-strong);
  box-shadow: 0 14px 30px rgba(0, 0, 0, 0.4); animation: toast-in 200ms ease;
}
.toast--ok { border-color: rgba(53, 208, 127, 0.5); }
.toast--bad { border-color: rgba(240, 104, 122, 0.5); }
.toast--out { opacity: 0; transform: translateY(6px); transition: all 400ms ease; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.22); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.36); background-clip: content-box; }
::selection { background: rgba(76, 201, 240, 0.28); }
</style></head>

<script>/* ---- dom.js ---- */
/** Tiny DOM layer: no framework, no virtual DOM, just functions. */
function h(tag, props = null, ...children) {
    const node = document.createElement(tag);
    if (props) {
        for (const [key, value] of Object.entries(props)) {
            if (value === null || value === undefined || value === false)
                continue;
            if (key === "class")
                node.className = String(value);
            else if (key === "text")
                node.textContent = String(value);
            else if (key === "html")
                node.innerHTML = String(value);
            else if (key === "dataset")
                Object.assign(node.dataset, value);
            else if (key.startsWith("on") && typeof value === "function") {
                node.addEventListener(key.slice(2).toLowerCase(), value);
            }
            else if (key in node && key !== "list") {
                node[key] = value;
            }
            else {
                node.setAttribute(key, String(value));
            }
        }
    }
    for (const child of children) {
        if (child === null || child === undefined || child === false)
            continue;
        node.append(typeof child === "string" || typeof child === "number" ? String(child) : child);
    }
    return node;
}
function clear(node) {
    node.replaceChildren();
    return node;
}
function toast(message, kind = "info") {
    let host = document.querySelector(".toasts");
    if (!host) {
        host = h("div", { class: "toasts" });
        document.body.append(host);
    }
    const item = h("div", { class: `toast toast--${kind}`, text: message });
    host.append(item);
    setTimeout(() => item.classList.add("toast--out"), 2600);
    setTimeout(() => item.remove(), 3100);
}
async function copy(text, label = "Copied") {
    try {
        await navigator.clipboard.writeText(text);
        toast(`${label} to clipboard`, "ok");
    }
    catch {
        toast("Clipboard blocked by the browser", "bad");
    }
}
function pretty(value) {
    return JSON.stringify(value, null, 2);
}
function bytes(n) {
    return n < 1000 ? `${n} B` : `${(n / 1000).toFixed(1)} kB`;
}

/* ---- api.js ---- */
/** Typed-ish fetch helpers for the Python API. */
async function api(path, body) {
    const res = await fetch(path, {
        method: body === undefined ? "GET" : "POST",
        headers: body === undefined ? {} : { "Content-Type": "application/json" },
        body: body === undefined ? undefined : JSON.stringify(body),
    });
    const text = await res.text();
    let data;
    try {
        data = JSON.parse(text);
    }
    catch {
        throw new Error(`${res.status}: ${text.slice(0, 200)}`);
    }
    if (!res.ok) {
        const err = data;
        throw new Error(err.message ?? `request failed (${res.status})`);
    }
    return data;
}

/** Shared building blocks: cards, code blocks, fields, badges. */

function card(title, subtitle, ...body) {
    return h("section", { class: "card" }, h("header", { class: "card__head" }, h("h2", { class: "card__title", text: title }), subtitle ? h("p", { class: "card__sub", text: subtitle }) : null), h("div", { class: "card__body" }, ...body));
}
function code(text, cls = "", label = "Copy") {
    const block = h("pre", { class: `code ${cls}` }, h("code", { text }));
    const btn = h("button", { class: "code__copy", type: "button", text: label });
    btn.addEventListener("click", () => void copy(text));

}
function field(label, control, hint = "") {

}
function input(props = {}) {

}

const SEV_ORDER = { critical: 0, high: 1, medium: 2, low: 3, info: 4 };
function scoreRing(score, grade) {
    const r = 42;
    const circumference = 2 * Math.PI * r;
    const offset = circumference * (1 - Math.max(0, Math.min(100, score)) / 100);
    const tone = score >= 90 ? "ok" : score >= 75 ? "good" : score >= 60 ? "warn" : "bad";
    const el = h("div", { class: "ring" });
    el.innerHTML = `
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="ring__track" cx="50" cy="50" r="${r}"></circle>
      <circle class="ring__bar ring__bar--${tone}" cx="50" cy="50" r="${r}"
        stroke-dasharray="${circumference.toFixed(1)}"
        stroke-dashoffset="${offset.toFixed(1)}"></circle>
    </svg>
    <div class="ring__text"><strong>${score}</strong><span>grade ${grade}</span></div>`;
    return el;
}
